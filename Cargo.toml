[package]
name = "icekcd"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", version = "0.15.0-dev", features = ["smol", "image"] }
clap = { version = "4.6.7", features = ["cargo", "derive"] }
dirs = "7.0.0"
ego-tree = "0.11.1"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false }
isahc = "2.0.2"
log = "0.4.35"
lucide-icons = "*"
open = "5.4.5"
rand = "0.10.3"
scraper = "0.29.0"
serde = "1.0.229"
serde-inline-default = "1.0.3"
serde_json = "1.0.154"
smol = "2.0.2"
toml = "1.2.1"
yanet = { git = "https://github.com/janTatesa/yanet", version = "0.1.0" }
iced_split = { git = "https://github.com/edwloef/iced_split", version = "0.2.0-dev" }


[patch.crates-io]
iced_core.git = "https://github.com/iced-rs/iced"
